<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>XTcer · 晶体矩阵 Crystalline</title>
<style>
  :root{--bg:#03050c;--ink:#eaf2ff;--dim:#7c8aa0;--cyan:#3d8dff;--violet:#a86bff;--lime:#2de8b0;--amber:#ffb454;--line:rgba(130,175,230,.14)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;inset:0;z-index:5;padding:22px 32px;pointer-events:none}
  .hud>*{pointer-events:auto}
  header{display:flex;justify-content:space-between;align-items:center}
  .logo{font-weight:800;letter-spacing:.16em;font-size:14px}
  .logo b{background:linear-gradient(90deg,var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:20px;font-size:12.5px;color:var(--dim)}
  nav a{color:inherit;text-decoration:none}nav a:hover{color:var(--cyan)}
  .left{position:absolute;left:32px;bottom:64px;max-width:440px}
  .k{font-size:11px;letter-spacing:.4em;color:var(--violet);margin-bottom:14px}
  h1{margin:0;font-size:clamp(32px,4.4vw,58px);line-height:1.02;letter-spacing:-.035em;font-weight:800;text-shadow:0 18px 60px rgba(0,0,0,.7)}
  h1 em{font-style:normal;background:linear-gradient(100deg,var(--amber),var(--violet) 55%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:18px 0 0;color:#9fb0c8;font-size:13.5px;line-height:1.9;max-width:400px;text-shadow:0 2px 18px rgba(2,4,10,.9)}
  .tip{position:fixed;right:32px;bottom:26px;z-index:6;font-size:11px;color:#4d5c73;letter-spacing:.1em}
  .drawer{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:min(520px,calc(100vw - 40px));max-height:72vh;overflow:auto;border:1px solid rgba(130,175,230,.24);border-radius:22px;padding:24px 26px;background:rgba(6,10,18,.94);backdrop-filter:blur(26px);opacity:0;pointer-events:none;transition:.4s cubic-bezier(.22,1,.36,1);box-shadow:0 50px 120px -40px rgba(0,0,0,.95)}
  .drawer.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .drawer .x{position:absolute;top:14px;right:16px;background:none;border:0;color:#66768c;font-size:20px;cursor:pointer}
  .drawer .dt{font-size:10.5px;letter-spacing:.3em;color:var(--amber);margin-bottom:10px}
  .drawer h2{margin:0 0 18px;font-size:22px}
  .item{display:flex;gap:12px;padding:11px 0;border-top:1px solid rgba(120,180,255,.1);font-size:13px;line-height:1.6}
  .item:last-child{border-bottom:1px solid rgba(120,180,255,.1)}
  .item b{font-weight:500;flex:1;color:#d8e4f4}.item span{font-size:11px;color:#7d8ca3;white-space:nowrap}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="hud">
  <header>
    <div class="logo">XT<b>cer</b> · LAB / CRYSTALLINE</div>
    <nav><a href="./">← 版本导航</a><a href="/deals">资源</a><a href="/feeds">情报</a></nav>
  </header>
</div>
<div class="left">
  <div class="k">CRYSTALLINE · 色散折射 · 悬停 / 点击</div>
  <h1>每颗晶体里<br><em>封存一条免费</em></h1>
  <p class="sub">悬浮的八面体棱镜，真实折射环境光。悬停高亮，点击任意一颗晶体查看它封存的资源。</p>
</div>
<div class="tip">HOVER · CLICK A CRYSTAL</div>

<div class="drawer" id="drawer">
  <button class="x" id="dx">×</button>
  <div class="dt" id="dt">CRYSTAL</div>
  <h2 id="dh">—</h2>
  <div id="dlist"></div>
</div>

<script src="./vendor/three.min.js"></script>
<script>
(function(){
  if(!window.THREE)return;
  const ITEMS=[
    ['Oracle Cloud ARM 4C24G','0 元 / 永久',0x5ad1ff],['Cloudflare Workers 10 万/天','0 元 / 月',0x7c5cff],
    ['GitHub Student Pack','学生',0x2de8b0],['Google Cloud $300','90 天',0xff8a5a],
    ['Supabase 500MB','0 元 / 月',0x5affb0],['Vercel Hobby','0 元 / 月',0x5ad1ff],
    ['Neon Postgres','0 元 / 月',0x7c5cff],['Sentry Developer','0 元 / 月',0x2de8b0],
    ['Astro 5 稳定','1 周',0xff8a5a],['D1 支持 5GB','2 周',0x5ad1ff],
    ['CVE-2025-29927','CRIT',0xff4d7a],['CVE-2025-53770','CRIT',0xff4d7a]
  ];

  const canvas=document.getElementById('gl');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  const DPR=Math.min(devicePixelRatio,1.5);
  renderer.setPixelRatio(DPR);renderer.setSize(innerWidth,innerHeight);
  renderer.setClearColor(0x03050c,1);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;

  // 程序化环境贴图（模拟影棚多窗光）→ PMREM
  function makeEnv(){
    const c=document.createElement('canvas');c.width=1024;c.height=512;
    const g=c.getContext('2d');
    const grd=g.createLinearGradient(0,0,0,512);
    grd.addColorStop(0,'#0a1226');grd.addColorStop(.45,'#162038');grd.addColorStop(.55,'#1b2742');grd.addColorStop(1,'#050810');
    g.fillStyle=grd;g.fillRect(0,0,1024,512);
    [[180,120,120,'#bfe4ff'],[520,100,160,'#ffffff'],[820,150,100,'#cfb6ff'],[340,360,140,'#9ff0c8'],[700,380,120,'#ffd6a0']].forEach(([x,y,r,col])=>{
      const rg=g.createRadialGradient(x,y,0,x,y,r);
      rg.addColorStop(0,col);rg.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=rg;g.fillRect(x-r,y-r,r*2,r*2);
    });
    const tex=new THREE.CanvasTexture(c);tex.mapping=THREE.EquirectangularReflectionMapping;
    return tex;
  }
  const pmrem=new THREE.PMREMGenerator(renderer);
  const envTex=pmrem.fromEquirectangular(makeEnv()).texture;

  const scene=new THREE.Scene();
  scene.environment=envTex;
  const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,200);
  camera.position.set(0,1,13);

  const group=new THREE.Group();scene.add(group);
  const crystals=[];
  // 中心主晶体
  function makeCrystal(radius,detail,color,idx){
    const geo=new THREE.OctahedronGeometry(radius,detail);
    const mat=new THREE.MeshPhysicalMaterial({
      color:color,metalness:.0,roughness:.06,transmission:.96,thickness:radius*1.6,
      ior:1.52,clearcoat:1,clearcoatRoughness:.06,envMapIntensity:1.2,
      emissive:color,emissiveIntensity:.05
    });
    const m=new THREE.Mesh(geo,mat);
    m.userData={idx,base:radius,hover:0};
    return m;
  }
  const center=makeCrystal(2.2,0,0xffffff,-1);
  group.add(center);crystals.push(center);
  // 环绕晶体
  ITEMS.forEach((it,i)=>{
    const ang=(i/ITEMS.length)*Math.PI*2;
    const rad=6.5+(i%2)*1.8;
    const m=makeCrystal(.9+(i%3)*.2,0,it[2],i);
    m.position.set(Math.cos(ang)*rad, Math.sin(i*1.3)*2.4-0.5, Math.sin(ang)*rad);
    m.rotation.set(i*0.7,i*1.1,i*0.3);
    group.add(m);crystals.push(m);
  });

  // 反射地面（暗色，承接晶体倒影）
  const floor=new THREE.Mesh(new THREE.CircleGeometry(28,64),
    new THREE.MeshStandardMaterial({color:0x05070e,metalness:.9,roughness:.35}));
  floor.rotation.x=-Math.PI/2;floor.position.y=-4.5;scene.add(floor);

  // 远景星
  const STN=500,sg=new THREE.BufferGeometry(),sp=new Float32Array(STN*3);
  for(let i=0;i<STN;i++){const u=Math.random()*2-1,t=Math.random()*Math.PI*2,r=70+Math.random()*120,s=Math.sqrt(1-u*u);sp[i*3]=r*s*Math.cos(t);sp[i*3+1]=r*u;sp[i*3+2]=r*s*Math.sin(t);}
  sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xaac4e0,size:.4,transparent:true,opacity:.5,sizeAttenuation:false})));

  // 交互：悬停高亮 + 点击
  const ray=new THREE.Raycaster();const mp=new THREE.Vector2();
  const drawer=document.getElementById('drawer');
  function openCrystal(idx){
    if(idx<0)return;
    const it=ITEMS[idx];
    document.getElementById('dt').textContent='CRYSTAL ·'+(idx<8?'FREE':idx<10?'INTEL':'CVE');
    document.getElementById('dh').textContent=it[0];
    document.getElementById('dlist').innerHTML=ITEMS.map(([v,k],i)=>
      `<div class="item"><b>${v}</b><span style="color:${k==='CRIT'?'#ff4d7a':i===idx?'#ffb454':'#7d8ca3'}">${i===idx?k+' ◀':k}</span></div>`).join('');
    drawer.classList.add('on');
  }
  canvas.addEventListener('pointermove',e=>{
    mp.x=(e.clientX/innerWidth)*2-1;mp.y=-(e.clientY/innerHeight)*2+1;
    ray.setFromCamera(mp,camera);
    const hit=ray.intersectObjects(crystals,false)[0];
    crystals.forEach(c=>{c.userData.hover=0;c.material.emissiveIntensity=0.05;});
    if(hit){hit.object.userData.hover=1;hit.object.material.emissiveIntensity=0.5;canvas.style.cursor='pointer';}
    else canvas.style.cursor='default';
  });
  canvas.addEventListener('click',e=>{
    mp.x=(e.clientX/innerWidth)*2-1;mp.y=-(e.clientY/innerHeight)*2+1;
    ray.setFromCamera(mp,camera);
    const hit=ray.intersectObjects(crystals,false)[0];
    if(hit)openCrystal(hit.object.userData.idx);
  });
  document.getElementById('dx').onclick=()=>drawer.classList.remove('on');
  addEventListener('keydown',e=>{if(e.key==='Escape')drawer.classList.remove('on')});

  let mx=0,my=0,tx=0,ty=0;
  addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5);ty=(e.clientY/innerHeight-.5)});
  const clock=new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const t=clock.getElapsedTime();
    mx+=(tx-mx)*.05;my+=(ty-my)*.05;
    group.rotation.y=t*.12+mx*.4;group.rotation.x=my*.18;
    center.rotation.y=-t*.2;center.rotation.x=t*.1;
    crystals.forEach((c,i)=>{
      if(i===0)return;
      c.rotation.x+=.002+i*0.0004;c.rotation.y+=.004+i*0.0003;
      const hover=c.userData.hover;
      c.scale.setScalar(1+hover*.35);
    });
    center.scale.setScalar(1+Math.sin(t*1.2)*.06);
    camera.position.x=mx*1.6;camera.position.y=1-my*1.2;
    camera.lookAt(0,0,0);
    renderer.render(scene,camera);
  }
  animate();
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script>
</body>
</html>
