<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>XTcer · 神经星云 Neural Nebula</title>
<style>
  :root{
    --bg:#02040a; --ink:#eaf2ff; --dim:#7c8aa0;
    --cyan:#3d8dff; --violet:#a86bff; --lime:#2de8b0; --red:#ff3d7a;
    --line:rgba(130,175,230,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  .scrim{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(90deg,rgba(2,4,10,.94) 0%,rgba(2,4,10,.74) 24%,rgba(2,4,10,.22) 50%,transparent 66%)}
  .hud{position:relative;z-index:5;height:100%;display:grid;
    grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);grid-template-rows:auto 1fr auto;
    padding:22px 32px;pointer-events:none}
  .hud > *{pointer-events:auto}
  header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
  header > *{pointer-events:auto}
  .logo{font-weight:800;letter-spacing:.16em;font-size:14px}
  .logo b{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:20px;font-size:12.5px;color:var(--dim)}
  nav a{color:inherit;text-decoration:none;transition:.25s}nav a:hover{color:var(--cyan)}

  .left{align-self:center;max-width:520px}
  .k{font-size:11px;letter-spacing:.4em;color:var(--cyan);margin-bottom:18px}
  h1{margin:0;font-size:clamp(36px,4.8vw,68px);line-height:.99;letter-spacing:-.035em;font-weight:800;
    text-shadow:0 18px 60px rgba(0,0,0,.7)}
  h1 em{font-style:normal;background:linear-gradient(100deg,#fff,var(--cyan) 45%,var(--violet));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:22px 0 0;color:#8e9cb4;font-size:14px;line-height:1.9;max-width:420px;
    text-shadow:0 2px 18px rgba(2,4,10,.9)}
  .forms{display:flex;gap:9px;margin-top:28px;flex-wrap:wrap}
  .forms button,.scan{background:rgba(10,15,26,.5);color:var(--dim);
    border:1px solid var(--line);padding:9px 17px;border-radius:99px;font-size:12.5px;
    cursor:pointer;transition:.3s;font-family:inherit;backdrop-filter:blur(10px)}
  .forms button:hover,.scan:hover{color:var(--ink);border-color:rgba(61,141,255,.5)}
  .forms button.on{background:linear-gradient(100deg,rgba(45,232,176,.22),rgba(168,107,255,.22));
    color:#fff;border-color:rgba(61,141,255,.6);box-shadow:0 0 26px -6px rgba(61,141,255,.55)}
  .scan{margin-top:14px;border-color:rgba(45,232,176,.32);color:#7fe6c0}
  .scan:hover{border-color:var(--lime);color:var(--lime);background:rgba(45,232,176,.08)}

  .right{align-self:center;justify-self:end;width:min(352px,100%)}
  .panel{border:1px solid var(--line);border-radius:20px;padding:18px 20px;
    background:rgba(6,10,18,.55);backdrop-filter:blur(22px) saturate(120%);
    box-shadow:0 30px 80px -40px rgba(0,0,0,.9)}
  .panel h3{margin:0 0 4px;font-size:11px;letter-spacing:.26em;color:#8fa0b8;font-weight:600}
  .panel .cap{font-size:11px;color:#5d6c83;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:11px;padding:10px 0;cursor:pointer;
    border-top:1px solid rgba(120,180,255,.08);transition:.25s}
  .row:hover{padding-left:4px}
  .row:last-of-type{border-bottom:1px solid rgba(120,180,255,.08)}
  .row i{width:8px;height:8px;border-radius:50%;flex:none}
  .row .n{font-size:12.5px;color:#c8d6e8;flex:1}
  .row .c{font-size:11.5px;color:#7d8ca3;font-variant-numeric:tabular-nums}
  .row .go{font-size:11px;color:#4e5c72;transition:.25s}
  .row:hover .go{color:var(--cyan);transform:translateX(2px)}
  .metaRow{margin-top:12px;font-size:10.5px;color:#4d5b70;display:flex;justify-content:space-between}

  footer{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;
    font-size:11px;color:#4d5c73;letter-spacing:.1em;padding-top:10px}

  .drawer{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);
    width:min(520px,calc(100vw - 40px));max-height:70vh;overflow:auto;
    border:1px solid rgba(130,175,230,.24);border-radius:22px;padding:24px 26px;
    background:rgba(6,10,18,.94);backdrop-filter:blur(26px);
    opacity:0;pointer-events:none;transition:.4s cubic-bezier(.22,1,.36,1);
    box-shadow:0 50px 120px -40px rgba(0,0,0,.95)}
  .drawer.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .drawer .x{position:absolute;top:14px;right:16px;background:none;border:0;color:#66768c;
    font-size:20px;cursor:pointer;line-height:1}
  .drawer .dt{font-size:10.5px;letter-spacing:.3em;color:var(--cyan);margin-bottom:10px}
  .drawer h2{margin:0 0 18px;font-size:22px;letter-spacing:-.01em}
  .item{display:flex;gap:12px;align-items:baseline;padding:11px 0;
    border-top:1px solid rgba(120,180,255,.1);font-size:13px;line-height:1.6}
  .item:last-child{border-bottom:1px solid rgba(120,180,255,.1)}
  .item b{font-weight:500;flex:1;color:#d8e4f4}
  .item span{font-size:11px;color:#7d8ca3;white-space:nowrap}
  .item .hi{color:var(--red)}
  .drawer .foot{margin-top:16px;font-size:12px}
  .drawer .foot a{color:var(--cyan);text-decoration:none}

  @media(max-width:860px){
    .hud{grid-template-columns:1fr;padding:16px}
    .right{display:none}
    .left{align-self:end;padding-bottom:52px}
    h1{font-size:clamp(34px,9vw,52px)}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="scrim"></div>

<div class="hud">
  <header>
    <div class="logo">XT<b>cer</b> · LAB / NEBULA</div>
    <nav><a href="./">← 版本导航</a><a href="/deals">资源</a><a href="/feeds">情报</a></nav>
  </header>

  <div class="left">
    <div class="k">NEURAL NEBULA · <span id="nodeCount">9,000</span> NODES</div>
    <h1>把信息<br>连成<em>一张网</em></h1>
    <p class="sub">每颗粒子是一条信息：可用的信源入口、技术情报、安全告警。三团星云彼此牵引，靠近、聚焦、点开——看清它们之间的关系。</p>
    <div class="forms" id="forms">
      <button data-f="0">球体</button>
      <button data-f="1">环面</button>
      <button data-f="2">立方</button>
      <button data-f="3">螺旋</button>
    </div>
    <button class="scan" id="scan">扫描一条情报 →</button>
  </div>

  <aside class="right">
    <div class="panel">
      <h3>CLUSTERS</h3>
      <div class="cap">悬停聚焦 · 点击查看条目</div>
      <div class="row" data-c="0">
        <i style="background:#2de8b0;box-shadow:0 0 12px #2de8b0"></i>
        <span class="n">信源入口</span><span class="c" id="c0">—</span><span class="go">›</span>
      </div>
      <div class="row" data-c="1">
        <i style="background:#3d8dff;box-shadow:0 0 12px #3d8dff"></i>
        <span class="n">技术情报</span><span class="c" id="c1">—</span><span class="go">›</span>
      </div>
      <div class="row" data-c="2">
        <i style="background:#ff3d7a;box-shadow:0 0 12px #ff3d7a"></i>
        <span class="n">安全告警</span><span class="c" id="c2">—</span><span class="go">›</span>
      </div>
      <div class="metaRow"><span>渲染 <b id="fps">—</b></span><span id="focusLabel">视角：全局</span></div>
    </div>
  </aside>

  <footer>
    <span>拖动 / 移动鼠标 · 星云跟随</span>
    <span>THREE.JS · CUSTOM BLOOM PIPELINE</span>
  </footer>
</div>

<div class="drawer" id="drawer">
  <button class="x" id="dx">×</button>
  <div class="dt" id="dt">CLUSTER</div>
  <h2 id="dh">—</h2>
  <div id="dlist"></div>
  <div class="foot" id="dfoot"></div>
</div>

<script src="./vendor/three.min.js"></script>
<script>
(function(){
  if(!window.THREE){document.body.innerHTML='<p style="padding:40px;color:#fff">three.js 未加载</p>';return}

  /* ================= 内容 ================= */
  const CLUSTERS=[
    { name:'信源入口', color:0x2de8b0, href:'/deals', tag:'FREE',
      items:[
        ['Oracle Cloud ARM 4C24G','0 元 / 永久'],
        ['Cloudflare Workers 10 万次/天','0 元 / 月'],
        ['GitHub Student Pack','0 元 / 学生'],
        ['Google Cloud $300','试用 / 90 天'],
        ['Supabase 500MB + Auth','0 元 / 月'],
        ['Vercel Hobby','0 元 / 月'],
        ['Neon Serverless Postgres','0 元 / 月'],
        ['Sentry Developer','0 元 / 月']
      ]},
    { name:'技术情报', color:0x3d8dff, href:'/feeds', tag:'INTEL',
      items:[
        ['Cloudflare 免费计划开放 Workers Logs','昨天'],
        ['Oracle 免费 ARM 实例扩容至 4C24G','3 天前'],
        ['OpenRouter 新增免费模型路由','5 天前'],
        ['Astro 5 稳定：SSR 与 Cloudflare 适配','1 周'],
        ['D1 支持 5GB 单库，边缘读延迟下降','2 周']
      ]},
    { name:'安全告警', color:0xff3d7a, href:'/feeds', tag:'CVE',
      items:[
        ['CVE-2025-29927 · Next.js 中间件鉴权绕过','CRIT'],
        ['CVE-2025-1974 · ingress-nginx 未授权 RCE','CRIT'],
        ['CVE-2025-53770 · SharePoint 在野利用','CRIT'],
        ['CVE-2025-3248 · Langflow 未授权执行','HIGH'],
        ['CVE-2025-24813 · Tomcat 部分写 RCE','HIGH']
      ]}
  ];

  /* ================= 确定性调试参数（可复现截图）================= */
  const QS=new URLSearchParams(location.search);
  const FREEZE_T = QS.has('t') ? parseFloat(QS.get('t')) : null;   // ?t=4 冻结时间
  const INIT_C = QS.has('c') ? parseInt(QS.get('c')) : -1;          // ?c=0 初始聚焦簇
  const INIT_F = QS.has('f') ? parseInt(QS.get('f')) : 0;           // ?f=3 初始形态

  /* ================= 基础 ================= */
  const canvas=document.getElementById('gl');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:false,powerPreference:'high-performance'});
  const DPR=Math.min(devicePixelRatio,1.5);
  renderer.setPixelRatio(DPR);
  renderer.setSize(innerWidth,innerHeight);
  renderer.setClearColor(0x02040a,1);
  renderer.toneMapping=THREE.NoToneMapping;   // 调色在合成阶段做

  const IS_MOBILE = innerWidth<760;
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,600);
  camera.position.set(0,0,46);

  const V3=new THREE.Vector3();

  /* ================= 星云背景（fbm） ================= */
  const bgScene=new THREE.Scene();
  const bgCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  const bgMat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0},uRes:{value:new THREE.Vector2(innerWidth,innerHeight)}},
    vertexShader:`void main(){ gl_Position=vec4(position.xy,0.,1.); }`,
    fragmentShader:`
      precision highp float;
      uniform float uTime; uniform vec2 uRes;
      float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
      float noise(vec2 p){
        vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
        return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),
                   mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);
      }
      float fbm(vec2 p){
        float v=0., a=.5;
        for(int i=0;i<5;i++){ v+=noise(p)*a; p*=2.07; a*=.5; }
        return v;
      }
      void main(){
        vec2 uv=gl_FragCoord.xy/uRes;
        vec2 p=uv*vec2(2.4,1.4);
        float t=uTime*.016;
        vec2 q=vec2(fbm(p+t*.6), fbm(p+vec2(4.7,1.9)-t*.5));
        float f=fbm(p+q*1.7);
        vec3 col=vec3(.006,.009,.020);
        vec3 cBlue=vec3(.04,.12,.36), cViolet=vec3(.22,.08,.38), cTeal=vec3(.02,.20,.24);
        col+=cBlue*smoothstep(.36,.92,f)*.30;
        col+=cViolet*pow(smoothstep(.42,1.0,f),1.6)*.26;
        col+=cTeal*smoothstep(.55,.95,f)*.14;
        float d=length((uv-vec2(.62,.5))*vec2(1.6,1.0));
        col+=vec3(.04,.09,.22)*exp(-d*3.6)*.40;
        col*=mix(.5,1.0,smoothstep(0.,.35,f));
        gl_FragColor=vec4(col,1.);
      }
    `,
    depthTest:false,depthWrite:false
  });
  bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),bgMat));

  /* ================= 粒子星云 ================= */
  const IS_SMALL=innerWidth<700;
  const COUNT=IS_SMALL?4200:9000;
  document.getElementById('nodeCount').textContent=COUNT.toLocaleString('en-US');

  const group=new THREE.Group(); scene.add(group);
  const geo=new THREE.BufferGeometry();
  const posA=new Float32Array(COUNT*3);
  const colA=new Float32Array(COUNT*3);
  const scaleA=new Float32Array(COUNT);
  const seedA=new Float32Array(COUNT);
  const cluA=new Float32Array(COUNT);

  const palette=[new THREE.Color(0x2de8b0),new THREE.Color(0x3d8dff),new THREE.Color(0xff3d7a)];
  const WHITE=new THREE.Color(0xffffff);
  const tmp=new THREE.Color();

  const centers=[
    new THREE.Vector3(-5.2,3.2,1.6),
    new THREE.Vector3(5.4,1.2,-2.6),
    new THREE.Vector3(-0.2,-4.8,3.0)
  ];
  const RAD=[7.6,6.2,6.8]; // 各簇半径，用于颜色梯度
  // 低成本 3D 噪声：把均匀分布揉成丝状
  const n3=(x,y,z)=>Math.sin(x*1.7+Math.sin(y*1.3))*Math.sin(y*1.9+Math.cos(z*1.1))*Math.sin(z*1.5+Math.sin(x*1.7));

  const forms=[];
  for(let f=0;f<4;f++) forms.push(new Float32Array(COUNT*3));
  const cur=new Float32Array(COUNT*3);

  for(let i=0;i<COUNT;i++){
    const cid=i%10<5?0:(i%10<8?1:2);
    cluA[i]=cid;
    const ctr=centers[cid];

    // 形态 0：三簇各异结构（旋臂盘 / 丝状球团 / 彗尾）
    let ox=0,oy=0,oz=0;
    if(cid===0){
      const arm=(i%2)?0:Math.PI;
      const rr=Math.pow(Math.random(),.95)*7.6;
      const ang=arm+rr*.52+(Math.random()-.5)*.58;
      const thick=(Math.random()-.5)*1.6*(1-rr/9.4);
      ox=Math.cos(ang)*rr; oz=Math.sin(ang)*rr*.84;
      oy=thick+Math.sin(rr*.72)*.42;
      const tilt=.3, ct=Math.cos(tilt), st=Math.sin(tilt);
      const ty=oy*ct-oz*st, tz=oy*st+oz*ct; oy=ty; oz=tz;
    }else if(cid===1){
      const u2=Math.random()*2-1, th2=Math.random()*Math.PI*2;
      const rr=Math.pow(Math.random(),.85)*6.2;
      const s2=Math.sqrt(1-u2*u2);
      ox=rr*s2*Math.cos(th2); oy=rr*u2; oz=rr*s2*Math.sin(th2);
      const n=n3(ox*.27,oy*.27,oz*.27);
      ox*=1+n*.32; oy*=1+n*.32; oz*=1+n*.32;
    }else{
      const t3=Math.random();
      ox=(t3-.5)*12.4;
      oy=(Math.random()-.5)*1.6+Math.sin(t3*7.2)*.9;
      oz=(Math.random()-.5)*1.6+Math.cos(t3*5.4)*.9;
      const wob=n3(ox*.22,oy*.22,oz*.22)*1.3;
      oy+=wob; oz+=wob*.6;
      const tl=.26, cl=Math.cos(tl), sl=Math.sin(tl);
      const nx=ox*cl-oy*sl, ny=ox*sl+oy*cl; ox=nx; oy=ny;
    }
    const sx=ox+ctr.x, sy=oy+ctr.y, sz=oz+ctr.z;

    // 形态 1：环面
    const a=Math.random()*Math.PI*2, b=Math.random()*Math.PI*2;
    const R=11.4, rr2=3.1+Math.random()*1.2;
    const tx=(R+rr2*Math.cos(b))*Math.cos(a)+ctr.x*.12;
    const ty=rr2*Math.sin(b)+ctr.y*.12;
    const tz=(R+rr2*Math.cos(b))*Math.sin(a)+ctr.z*.12;

    // 形态 2：立方
    let cx,cy,cz; const half=10.8, e=Math.random();
    if(e<.34){cx=half;cy=(Math.random()*2-1)*half;cz=(Math.random()*2-1)*half;}
    else if(e<.67){cx=(Math.random()*2-1)*half;cy=half;cz=(Math.random()*2-1)*half;}
    else{cx=(Math.random()*2-1)*half;cy=(Math.random()*2-1)*half;cz=half;}

    // 形态 3：螺旋
    const t2=i/COUNT*Math.PI*7, rad=2+t2*1.12;
    const hx=Math.cos(t2)*rad+ctr.x*.1, hy=(t2-10)*1.12+ctr.y*.1, hz=Math.sin(t2)*rad+ctr.z*.1;

    forms[0].set([sx,sy,sz],i*3);
    forms[1].set([tx,ty,tz],i*3);
    forms[2].set([cx,cy,cz],i*3);
    forms[3].set([hx,hy,hz],i*3);
    cur.set([sx,sy,sz],i*3);

    // 颜色：按到簇心距离做梯度（核偏白 → 边饱和），写进属性，运行时不再乱混
    const rd=Math.hypot(ox,oy,oz);
    const hot=Math.max(0,1-rd/RAD[cid]);
    tmp.copy(palette[cid]).lerp(WHITE,hot*.16);
    tmp.offsetHSL((Math.random()-.5)*.03,.06,(Math.random()-.5)*.14);
    colA[i*3]=tmp.r; colA[i*3+1]=tmp.g; colA[i*3+2]=tmp.b;

    // 尺寸：多数细尘，极少数大亮星（点尺寸上限在 shader 里）
    const rk=Math.random();
    scaleA[i]=.42+Math.pow(rk,2.8)*2.0;
    seedA[i]=Math.random()*6.2831;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(cur,3));
  geo.setAttribute('aColor',new THREE.BufferAttribute(colA,3));
  geo.setAttribute('aScale',new THREE.BufferAttribute(scaleA,1));
  geo.setAttribute('aSeed',new THREE.BufferAttribute(seedA,1));
  geo.setAttribute('aCluster',new THREE.BufferAttribute(cluA,1));

  const mat=new THREE.ShaderMaterial({
    uniforms:{
      uTime:{value:0},uSize:{value:1.0},uPR:{value:DPR},
      uMouse:{value:new THREE.Vector2(0,0)},
      uW:{value:new THREE.Vector3(1,1,1)}   // 三簇权重，聚焦时非聚焦簇压低
    },
    vertexShader:`
      attribute vec3 aColor; attribute float aScale; attribute float aSeed; attribute float aCluster;
      uniform float uTime,uSize,uPR; uniform vec2 uMouse; uniform vec3 uW;
      varying vec3 vColor; varying float vA; varying float vFocus;
      void main(){
        vColor=aColor;
        vFocus = aCluster<0.5 ? uW.x : (aCluster<1.5 ? uW.y : uW.z);
        vec3 p=position;
        // 有机漂移（curl 近似）
        p.x+=sin(uTime*0.25+aSeed)*0.5;
        p.y+=cos(uTime*0.22+aSeed*1.3)*0.4;
        p.z+=sin(uTime*0.28+aSeed*0.7)*0.5;
        vec2 d=uMouse*16.0-p.xy;
        p.xy+=normalize(d+0.0001)*smoothstep(22.0,0.0,length(d))*1.2;
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        float depth=max(1.0,-mv.z);
        float near=smoothstep(40.0,30.0,depth);   // 近景散焦
        float base=uSize*aScale*uPR*(240.0/depth)*(0.8+vFocus*0.35)*(1.0+near*0.8);
        gl_PointSize=min(base, 22.0);              // 上限：根治近景白团与过曝
        gl_Position=projectionMatrix*mv;
        vA=(0.55+0.45*sin(uTime*1.7+aSeed*12.0))*(1.0-near*0.45);
      }
    `,
    fragmentShader:`
      varying vec3 vColor; varying float vA; varying float vFocus;
      void main(){
        vec2 uv=gl_PointCoord-0.5;
        float d=length(uv);
        if(d>0.5) discard;
        float core=pow(smoothstep(0.5,0.0,d),2.8);
        float glow=smoothstep(0.5,0.0,d)*0.18;
        vec3 c=vColor*(0.42+core*1.25)+vec3(glow*0.12);
        gl_FragColor=vec4(c,((core+glow)*vA*0.5)*vFocus);
      }
    `,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
  });
  group.add(new THREE.Points(geo,mat));

  // 同类连线（细丝网络）
  const LS=IS_SMALL?120:300;
  const lp=new Float32Array(LS*6);
  for(let i=0;i<LS;i++){
    const cid=i%3, seg=Math.floor(COUNT/3);
    const a=Math.floor(Math.random()*seg)+cid*seg;
    const b=Math.floor(Math.random()*seg)+cid*seg;
    lp.set([cur[a*3],cur[a*3+1],cur[a*3+2]],i*6);
    lp.set([cur[b*3],cur[b*3+1],cur[b*3+2]],i*6+3);
  }
  const lgeo=new THREE.BufferGeometry();
  lgeo.setAttribute('position',new THREE.BufferAttribute(lp,3));
  const lines=new THREE.LineSegments(lgeo,new THREE.LineBasicMaterial({
    color:0x4f8fc8,transparent:true,opacity:.10,blending:THREE.AdditiveBlending,depthWrite:false
  }));
  group.add(lines);

  /* ================= 中心亮核 ================= */
  function glowTex(){
    const c=document.createElement('canvas'); c.width=c.height=128;
    const g=c.getContext('2d');
    const rg=g.createRadialGradient(64,64,0,64,64,64);
    rg.addColorStop(0,'rgba(255,255,255,1)');
    rg.addColorStop(.16,'rgba(205,236,255,.85)');
    rg.addColorStop(.46,'rgba(90,150,255,.20)');
    rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rg; g.fillRect(0,0,128,128);
    const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
  }
  const coreSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(),color:0xffffff,
    transparent:true,opacity:.5,depthWrite:false,blending:THREE.AdditiveBlending}));
  coreSprite.scale.setScalar(2.6);
  scene.add(coreSprite);

  // 分层雾（远景柔光片，制造景深）
  function mistTex(){
    const c=document.createElement('canvas'); c.width=c.height=256;
    const g=c.getContext('2d');
    const rg=g.createRadialGradient(128,128,0,128,128,128);
    rg.addColorStop(0,'rgba(120,180,255,.30)');
    rg.addColorStop(.45,'rgba(90,130,220,.10)');
    rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rg; g.fillRect(0,0,256,256);
    const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
  }
  const mists=[];
  for(let i=0;i<4;i++){
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({
      map:mistTex(),transparent:true,opacity:.5,depthWrite:false,blending:THREE.AdditiveBlending
    }));
    sp.scale.setScalar(40+Math.random()*36);
    sp.position.set((Math.random()-.5)*90,(Math.random()-.5)*56,-40-Math.random()*80);
    sp.userData.ph=Math.random()*6.28;
    scene.add(sp); mists.push(sp);
  }

  // 簇体积光：每簇一团同色柔光（包裹星团）
  const glows=[];
  centers.forEach((c,i)=>{
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({
      map:mistTex(),color:palette[i].getHex(),transparent:true,opacity:.1,depthWrite:false,
      blending:THREE.AdditiveBlending
    }));
    sp.position.copy(c);
    sp.scale.setScalar(i===2?11:9);
    group.add(sp); glows.push(sp);
  });

  /* ================= 体积光带（god-ray 式，从簇核射出）================= */
  const shaftMats=[];
  const SHADER_SHAFT_V=`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`;
  const SHADER_SHAFT_F=`
    precision highp float;
    varying vec2 vUv; uniform float uOpacity,uTime; uniform vec3 uColor;
    void main(){
      float across=sin(vUv.x*3.14159);
      float along=smoothstep(0.0,0.25,vUv.y)*(1.0-smoothstep(0.55,1.0,vUv.y));
      float flicker=0.85+0.15*sin(uTime*0.7+vUv.x*9.0);
      gl_FragColor=vec4(uColor, across*along*uOpacity*flicker);
    }`;
  const shaftsGroup=new THREE.Group(); group.add(shaftsGroup);
  for(let ci=0;ci<3;ci++){
    const m=new THREE.ShaderMaterial({
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
      uniforms:{uOpacity:{value:.5},uTime:{value:0},uColor:{value:palette[ci].clone().lerp(WHITE,.35)}}
    });
    m.vertexShader=SHADER_SHAFT_V; m.fragmentShader=SHADER_SHAFT_F;
    shaftMats.push(m);
    for(let s=0;s<4;s++){
      const w=1.6+Math.random()*1.8, h=18;
      const q=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);
      q.position.copy(centers[ci]);
      q.lookAt(centers[ci].x, centers[ci].y-1, centers[ci].z);
      q.rotation.set(0, Math.random()*Math.PI, 0);
      q.rotateOnWorldAxis(new THREE.Vector3(0,0,1), 0.3+Math.random()*.3);
      shaftsGroup.add(q);
    }
  }

  /* ================= 前景尘雾（Fable 式漂移 Points）================= */
  (function makeDust(){
    const N=IS_SMALL?220:420;
    const dg=new THREE.BufferGeometry();
    const dp=new Float32Array(N*3), ds=new Float32Array(N);
    for(let i=0;i<N;i++){
      dp[i*3]=(Math.random()-.5)*80;
      dp[i*3+1]=(Math.random()-.5)*44;
      dp[i*3+2]=(Math.random()-.5)*50-6;
      ds[i]=Math.random()*6.28;
    }
    dg.setAttribute('position',new THREE.BufferAttribute(dp,3));
    dg.setAttribute('aSeed',new THREE.BufferAttribute(ds,1));
    const dm=new THREE.ShaderMaterial({
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
      uniforms:{uTime:{value:0},uSize:{value:1.8},uColor:{value:new THREE.Color(0x9fb8ff)},uOpacity:{value:.5}},
      vertexShader:`
        attribute float aSeed; uniform float uTime,uSize; varying float vTw;
        void main(){
          vec3 p=position;
          p.x+=sin(uTime*0.3+aSeed)*1.2;
          p.y+=cos(uTime*0.22+aSeed*1.7)*0.8;
          p.z+=cos(uTime*0.26+aSeed*0.9)*1.2;
          vTw=0.6+0.4*sin(uTime*(1.5+fract(aSeed)*2.0)+aSeed*7.0);
          vec4 mv=modelViewMatrix*vec4(p,1.);
          gl_PointSize=min(uSize*(140.0/-mv.z),14.0);
          gl_Position=projectionMatrix*mv;
        }`,
      fragmentShader:`
        uniform vec3 uColor; uniform float uOpacity; varying float vTw;
        void main(){
          float d=length(gl_PointCoord-0.5);
          float a=smoothstep(0.5,0.05,d);
          gl_FragColor=vec4(uColor, a*vTw*uOpacity);
        }`
    });
    scene.add(new THREE.Points(dg,dm));
    window.__dustMat=dm;
  })();
  const dustMat=window.__dustMat;

  // 远景恒星
  const STN=IS_SMALL?260:620;
  const stg=new THREE.BufferGeometry();
  const stp=new Float32Array(STN*3);
  for(let i=0;i<STN;i++){
    stp[i*3]=(Math.random()-.5)*420;
    stp[i*3+1]=(Math.random()-.5)*260;
    stp[i*3+2]=-40-Math.random()*280;
  }
  stg.setAttribute('position',new THREE.BufferAttribute(stp,3));
  const starMat=new THREE.PointsMaterial({color:0xcfe4ff,size:.55,transparent:true,
    opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending});
  scene.add(new THREE.Points(stg,starMat));

  // 扫描脉冲
  const pulse=new THREE.Mesh(new THREE.RingGeometry(.6,1.2,64),
    new THREE.MeshBasicMaterial({color:0x2de8b0,transparent:true,opacity:0,side:THREE.DoubleSide,
      blending:THREE.AdditiveBlending,depthWrite:false}));
  scene.add(pulse);
  let pulseT=1;

  /* ================= 后处理管线 ================= */
  const gl=renderer.getContext();
  const halfFloat = (gl.getExtension('EXT_color_buffer_half_float')||gl.getExtension('EXT_color_buffer_float')) ? THREE.HalfFloatType : THREE.UnsignedByteType;

  const rtSize=new THREE.Vector2();
  renderer.getDrawingBufferSize(rtSize);
  const sceneRT=new THREE.WebGLRenderTarget(rtSize.x,rtSize.y,{
    minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,
    type:halfFloat,depthBuffer:true
  });
  const BW=Math.max(1,Math.round(rtSize.x/3)), BH=Math.max(1,Math.round(rtSize.y/3));
  const brightRT=new THREE.WebGLRenderTarget(BW,BH,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,type:halfFloat,depthBuffer:false});
  const blurA=new THREE.WebGLRenderTarget(BW,BH,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,type:halfFloat,depthBuffer:false});
  const blurB=new THREE.WebGLRenderTarget(BW,BH,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,type:halfFloat,depthBuffer:false});

  const quadCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  const quadGeo=new THREE.PlaneGeometry(2,2);
  const fsScene=new THREE.Scene();

  const brightMat=new THREE.ShaderMaterial({
    uniforms:{tDiffuse:{value:null},uThreshold:{value:1.0}},
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
    fragmentShader:`
      uniform sampler2D tDiffuse; uniform float uThreshold; varying vec2 vUv;
      void main(){
        vec3 c=texture2D(tDiffuse,vUv).rgb;
        float l=max(max(c.r,c.g),c.b);
        float k=smoothstep(uThreshold,uThreshold+.5,l);
        gl_FragColor=vec4(c*k,1.);
      }`,
    depthTest:false,depthWrite:false
  });
  const blurMat=new THREE.ShaderMaterial({
    uniforms:{tDiffuse:{value:null},uDir:{value:new THREE.Vector2(1,0)},uTexel:{value:new THREE.Vector2(1/BW,1/BH)}},
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
    fragmentShader:`
      uniform sampler2D tDiffuse; uniform vec2 uDir,uTexel; varying vec2 vUv;
      void main(){
        vec2 o=uDir*uTexel;
        vec3 s=texture2D(tDiffuse,vUv).rgb*0.227;
        s+=texture2D(tDiffuse,vUv+o*1.3846).rgb*0.3162;
        s+=texture2D(tDiffuse,vUv-o*1.3846).rgb*0.3162;
        s+=texture2D(tDiffuse,vUv+o*3.2308).rgb*0.0702;
        s+=texture2D(tDiffuse,vUv-o*3.2308).rgb*0.0702;
        gl_FragColor=vec4(s,1.);
      }`,
    depthTest:false,depthWrite:false
  });
  const compMat=new THREE.ShaderMaterial({
    uniforms:{
      tScene:{value:null},tBloom:{value:null},
      uTime:{value:0},uRes:{value:new THREE.Vector2(innerWidth,innerHeight)},
      uBloom:{value:.5},uExposure:{value:1.0},uCA:{value:1.0},uGrain:{value:.03}
    },
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
    fragmentShader:`
      precision highp float;
      uniform sampler2D tScene,tBloom;
      uniform float uTime,uBloom,uExposure,uCA,uGrain;
      uniform vec2 uRes;
      varying vec2 vUv;
      vec3 aces(vec3 x){
        x*=1.05;
        const float a=2.51,b=.03,c=2.43,d=.59,e=.14;
        return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.,1.);
      }
      float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
      void main(){
        vec2 dd=vUv-0.5;
        float r2=dot(dd,dd);
        vec2 off=dd*r2*0.012*uCA;
        vec3 base;
        base.r=texture2D(tScene,vUv+off).r;
        base.g=texture2D(tScene,vUv).g;
        base.b=texture2D(tScene,vUv-off).b;
        vec3 bloom=texture2D(tBloom,vUv).rgb;
        vec3 col=base+bloom*uBloom;
        col=aces(col*uExposure);
        col=pow(col,vec3(1.0/2.2));
        float vig=smoothstep(0.95,0.15,r2*1.9);
        col*=mix(0.42,1.0,vig);
        float n=hash(vUv*uRes+fract(uTime)*137.0)-0.5;
        col+=n*uGrain;
        gl_FragColor=vec4(col,1.);
      }`,
    depthTest:false,depthWrite:false
  });
  const quad=new THREE.Mesh(quadGeo,compMat);
  fsScene.add(quad);

  /* ================= 状态预设：平滑插值，不是开关 ================= */
  // 每个簇：w=权重(粒子亮度), shaft=光带强度
  function mkPreset(w0,w1,w2, s0,s1,s2, bloom, exposure, camZ, dust){
    return {w:[w0,w1,w2], shaft:[s0,s1,s2], bloom, exposure, camZ, dust};
  }
  const PRESETS={
    global: mkPreset(1,1,1,  .45,.45,.45,  .5, 1.0, 46, .5),
    c0:     mkPreset(1,.1,.1, 1.0,.12,.12,  .6, 1.04, 40, .62),
    c1:     mkPreset(.1,1,.1,  .12,1.0,.12,  .6, 1.04, 40, .62),
    c2:     mkPreset(.1,.1,1,  .12,.12,1.0,  .6, 1.04, 40, .62)
  };
  // 当前态 / 目标态
  const state=JSON.parse(JSON.stringify(PRESETS.global));
  let target=PRESETS.global;
  if(INIT_C>=0 && PRESETS['c'+INIT_C]) target=PRESETS['c'+INIT_C];

  /* ================= 面板 / Drawer ================= */
  CLUSTERS.forEach((c,i)=>{ document.getElementById('c'+i).textContent=c.items.length+' 条'; });
  const drawer=document.getElementById('drawer');
  const dlist=document.getElementById('dlist');
  let focus=-1, hoverPreview=false;

  function applyTarget(){
    const label=document.getElementById('focusLabel');
    if(target===PRESETS.global) label.textContent='视角：全局';
    else{
      const idx=['c0','c1','c2'].findIndex(k=>PRESETS[k]===target);
      if(idx>=0) label.textContent='聚焦：'+CLUSTERS[idx].name;
    }
  }
  function setGlobal(){ target=PRESETS.global; focus=-1; applyTarget(); }
  function openCluster(cid){
    const c=CLUSTERS[cid];
    document.getElementById('dt').textContent=c.tag+' CLUSTER';
    document.getElementById('dh').textContent=c.name;
    dlist.innerHTML=c.items.map(([n,v])=>
      `<div class="item"><b>${n}</b><span class="${v==='CRIT'?'hi':''}">${v}</span></div>`).join('');
    document.getElementById('dfoot').innerHTML=`<a href="${c.href}">查看全部 ${c.name} →</a>`;
    drawer.classList.add('on');
    target=PRESETS['c'+cid]; focus=cid; applyTarget();
    pulse.position.copy(centers[cid]); pulseT=0;
  }
  document.getElementById('dx').onclick=()=>{ drawer.classList.remove('on'); setGlobal(); };

  document.querySelectorAll('.row').forEach(row=>{
    const cid=+row.dataset.c;
    row.onmouseenter=()=>{
      hoverPreview=true;
      if(!drawer.classList.contains('on')){ target=PRESETS['c'+cid]; focus=cid; applyTarget(); }
    };
    row.onmouseleave=()=>{
      hoverPreview=false;
      if(!drawer.classList.contains('on')){ setGlobal(); }
    };
    row.onclick=()=>openCluster(cid);
  });
  document.getElementById('scan').onclick=()=>openCluster(Math.random()<.55?2:1);

  /* ================= 形态切换 ================= */
  let form=INIT_F,nextForm=INIT_F,morph=1;
  document.querySelectorAll('#forms button').forEach(b=>{
    if(+b.dataset.f===INIT_F) b.classList.add('on');
    b.onclick=()=>{
      document.querySelectorAll('#forms button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      const nf=+b.dataset.f;
      if(nf===form) return;
      nextForm=nf; morph=0;
    };
  });

  /* ================= 交互 ================= */
  const mouse={x:0,y:0}, targetM={x:0,y:0};
  let dragging=false,lastX=0,spin=0,spinT=0;
  addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX});
  addEventListener('pointerup',()=>{dragging=false});
  addEventListener('pointermove',e=>{
    targetM.x=(e.clientX/innerWidth-.5)*2;
    targetM.y=-(e.clientY/innerHeight-.5)*2;
    if(dragging){ spinT+=(e.clientX-lastX)*.006; lastX=e.clientX; }
  });
  addEventListener('keydown',e=>{
    if(e.key==='Escape'){ drawer.classList.remove('on'); setGlobal(); }
    if(e.key>='1'&&e.key<='3') openCluster(+e.key-1);
  });

  /* ================= 循环 ================= */
  let fpsN=0,fpsAcc=0,fpsT=performance.now();
  const fpsEl=document.getElementById('fps');
  const clock=new THREE.Clock();
  const camTarget=new THREE.Vector3();
  const camPos=new THREE.Vector3();

  function renderQuad(material,t){
    quad.material=material;
    renderer.setRenderTarget(t);
    renderer.clear();
    renderer.render(fsScene,quadCam);
  }

  function lerp(a,b,k){return a+(b-a)*k}

  function animate(){
    requestAnimationFrame(animate);
    // dt 始终推进（驱动状态/相机/形态插值），只冻结动画时间 t
    const dt=Math.min(.05,clock.getDelta());
    const t=FREEZE_T!=null?FREEZE_T:clock.elapsedTime;

    mouse.x+=(targetM.x-mouse.x)*.05;
    mouse.y+=(targetM.y-mouse.y)*.05;
    mat.uniforms.uMouse.value.set(mouse.x,mouse.y);
    mat.uniforms.uTime.value=t;
    bgMat.uniforms.uTime.value=t;
    compMat.uniforms.uTime.value=t;
    dustMat.uniforms.uTime.value=t;
    shaftMats.forEach(m=>m.uniforms.uTime.value=t);

    // 状态平滑过渡
    const k=Math.min(1,dt*1.8);
    for(let i=0;i<3;i++){
      state.w[i]=lerp(state.w[i],target.w[i],k);
      state.shaft[i]=lerp(state.shaft[i],target.shaft[i],k);
    }
    state.bloom=lerp(state.bloom,target.bloom,k);
    state.exposure=lerp(state.exposure,target.exposure,k);
    state.camZ=lerp(state.camZ,target.camZ,k);
    state.dust=lerp(state.dust,target.dust,k);
    mat.uniforms.uW.value.set(state.w[0],state.w[1],state.w[2]);
    shaftMats.forEach((m,i)=>m.uniforms.uOpacity.value=state.shaft[i]);
    dustMat.uniforms.uOpacity.value=state.dust;
    compMat.uniforms.uBloom.value=state.bloom;
    compMat.uniforms.uExposure.value=state.exposure;

    // 相机：聚焦时推向该簇中心
    const camGoal = (target===PRESETS.global) ? V3.set(0,0,0)
      : (function(){ const idx=['c0','c1','c2'].findIndex(kk=>PRESETS[kk]===target); return idx>=0?centers[idx]:V3.set(0,0,0); })();
    camTarget.lerp(camGoal,k);
    const zGoal=state.camZ-Math.abs(mouse.y)*2.4;
    camera.position.x=lerp(camera.position.x, mouse.x*1.1, .04);
    camera.position.y=lerp(camera.position.y, mouse.y*0.8, .04);
    camera.position.z=lerp(camera.position.z, zGoal, .04);
    camera.lookAt(camTarget);

    // 形态过渡
    if(morph<1){
      morph=Math.min(1,morph+dt*1.5);
      const e=morph<.5?2*morph*morph:1-Math.pow(-2*morph+2,2)/2;
      const A=forms[form],B=forms[nextForm],P=geo.attributes.position.array;
      for(let i=0;i<COUNT*3;i++) P[i]=A[i]+(B[i]-A[i])*e;
      geo.attributes.position.needsUpdate=true;
      if(morph>=1) form=nextForm;
    }

    spin+=(spinT-spin)*.08; spinT*=.995;
    group.rotation.y=t*.05+spin+mouse.x*.24;
    group.rotation.x=mouse.y*.12;

    if(pulseT<1){
      pulseT=Math.min(1,pulseT+dt*.9);
      pulse.scale.setScalar(.4+pulseT*7);
      pulse.material.opacity=(1-pulseT)*.9;
      pulse.quaternion.copy(camera.quaternion);
    }

    coreSprite.scale.setScalar(2.5+Math.sin(t*2.2)*.25);
    coreSprite.material.opacity=.48+Math.sin(t*1.6)*.08;
    mists.forEach((m,i)=>{
      m.material.opacity=.03+Math.abs(Math.sin(t*.24+i))*.03;
      m.position.x+=Math.sin(t*.12+i)*.004;
    });
    glows.forEach((g,i)=>{
      g.material.opacity=.05+Math.abs(Math.sin(t*.3+i*1.7))*.04;
      g.scale.setScalar((i===2?11:9)*(1+Math.sin(t*.5+i)*.03));
    });

    /* --- 1. 场景到 RT（背景 + 主场景）--- */
    renderer.setRenderTarget(sceneRT);
    renderer.clear();
    renderer.render(bgScene,bgCam);
    renderer.autoClear=false;
    renderer.render(scene,camera);
    renderer.autoClear=true;

    /* --- 2. 亮部提取 --- */
    brightMat.uniforms.tDiffuse.value=sceneRT.texture;
    renderQuad(brightMat,brightRT);

    /* --- 3. 两轮可分离高斯模糊 --- */
    blurMat.uniforms.tDiffuse.value=brightRT.texture;
    blurMat.uniforms.uDir.value.set(1,0); renderQuad(blurMat,blurA);
    blurMat.uniforms.tDiffuse.value=blurA.texture;
    blurMat.uniforms.uDir.value.set(0,1); renderQuad(blurMat,blurB);
    blurMat.uniforms.tDiffuse.value=blurB.texture;
    blurMat.uniforms.uDir.value.set(1.6,0); renderQuad(blurMat,blurA);
    blurMat.uniforms.tDiffuse.value=blurA.texture;
    blurMat.uniforms.uDir.value.set(0,1.6); renderQuad(blurMat,blurB);

    /* --- 4. 合成到屏幕 --- */
    compMat.uniforms.tScene.value=sceneRT.texture;
    compMat.uniforms.tBloom.value=blurB.texture;
    renderQuad(compMat,null);

    fpsN++; fpsAcc+=dt;
    if(performance.now()-fpsT>600){
      fpsEl.textContent=FREEZE_T!=null?'—':(Math.round(fpsN/Math.max(fpsAcc,1e-3))+' fps');
      fpsN=0; fpsAcc=0; fpsT=performance.now();
    }
  }
  animate();

  /* ================= 尺寸 ================= */
  function resize(){
    const w=innerWidth,h=innerHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setPixelRatio(DPR);
    renderer.setSize(w,h);
    bgMat.uniforms.uRes.value.set(w,h);
    compMat.uniforms.uRes.value.set(w,h);
    renderer.getDrawingBufferSize(rtSize);
    sceneRT.setSize(rtSize.x,rtSize.y);
    const bw=Math.max(1,Math.round(rtSize.x/3)), bh=Math.max(1,Math.round(rtSize.y/3));
    brightRT.setSize(bw,bh); blurA.setSize(bw,bh); blurB.setSize(bw,bh);
    blurMat.uniforms.uTexel.value.set(1/bw,1/bh);
  }
  addEventListener('resize',resize);

  if(IS_MOBILE){ compMat.uniforms.uGrain.value=.025; }
})();
</script>
</body>
</html>
